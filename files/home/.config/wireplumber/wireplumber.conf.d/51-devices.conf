monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_.*usb-Logitech_PRO_X.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
  {
    matches = [ { device.name = "alsa_card.pci-0000_07_00.1" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
