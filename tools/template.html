<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arch Setup Guide</title>
<meta name="description" content="{{TITLE}}">
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #1d1f21;
  --muted: #5c6166;
  --border: #e0e0da;
  --accent: #1f6feb;
  --accent-soft: #e6efff;
  --done: #1a7f37;
  --done-soft: #e3f4e7;
  --code-bg: #16181d;
  --code-text: #e6e6e6;
  --code-bar: #23262d;
  --warn-bg: #fff7e0;
  --warn-border: #e0b400;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317;
    --surface: #181b20;
    --surface-2: #20242b;
    --text: #e4e6ea;
    --muted: #9aa1ab;
    --border: #2c3139;
    --accent: #6ea8ff;
    --accent-soft: #1c2a42;
    --done: #4cc36b;
    --done-soft: #17301f;
    --code-bg: #0b0d10;
    --code-text: #e6e6e6;
    --code-bar: #1a1d23;
    --warn-bg: #2b2412;
    --warn-border: #b38f00;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111317;
  --surface: #181b20;
  --surface-2: #20242b;
  --text: #e4e6ea;
  --muted: #9aa1ab;
  --border: #2c3139;
  --accent: #6ea8ff;
  --accent-soft: #1c2a42;
  --done: #4cc36b;
  --done-soft: #17301f;
  --code-bg: #0b0d10;
  --code-text: #e6e6e6;
  --code-bar: #1a1d23;
  --warn-bg: #2b2412;
  --warn-border: #b38f00;
  --shadow: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, pre, kbd { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, "DejaVu Sans Mono", monospace; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 15px; font-weight: 650; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
.progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--done); transition: width .25s ease; }
.progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.topbar button {
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 10px; cursor: pointer;
}
.topbar button:hover { border-color: var(--accent); }
.menu-btn { display: none; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
nav.toc {
  position: sticky; top: 53px; align-self: start;
  height: calc(100vh - 53px); overflow-y: auto;
  padding: 20px 12px 40px 20px;
  border-right: 1px solid var(--border);
  font-size: 14px;
}
nav.toc ol { list-style: none; margin: 0; padding: 0; }
nav.toc > ol > li { margin-bottom: 6px; }
nav.toc ol ol { padding-left: 12px; margin-top: 2px; border-left: 1px solid var(--border); }
nav.toc a {
  display: block; padding: 3px 8px; border-radius: 5px;
  color: var(--muted); text-decoration: none; line-height: 1.4;
}
nav.toc > ol > li > a { color: var(--text); font-weight: 600; }
nav.toc a:hover { background: var(--surface-2); color: var(--text); }
nav.toc a.active { background: var(--accent-soft); color: var(--accent); }
nav.toc a.is-done::before { content: "✓ "; color: var(--done); font-weight: 700; }

main { padding: 28px 40px 120px; min-width: 0; }
.content { max-width: 920px; }

/* ---------- Typography ---------- */
.lede { color: var(--muted); }
h2 { font-size: 26px; line-height: 1.25; margin: 56px 0 16px; padding-top: 12px; border-top: 1px solid var(--border); }
h3 { font-size: 19px; line-height: 1.3; margin: 36px 0 12px; }
h2:first-of-type { border-top: 0; margin-top: 16px; }
p, ul, ol { margin: 0 0 14px; }
li { margin: 4px 0; }
a { color: var(--accent); }
hr { display: none; }
strong { font-weight: 650; }
:not(pre) > code {
  font-size: .88em; padding: .12em .38em; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--border);
  overflow-wrap: anywhere;
}

/* ---------- Step checkboxes ---------- */
.step { display: flex; align-items: baseline; gap: 10px; }
.done-toggle { position: relative; flex: none; cursor: pointer; top: 2px; }
.done-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.done-toggle .box {
  display: inline-block; width: 20px; height: 20px; border-radius: 5px;
  border: 2px solid var(--border); background: var(--surface);
  transition: background .15s, border-color .15s;
}
h3 .done-toggle .box { width: 17px; height: 17px; }
.done-toggle:hover .box { border-color: var(--done); }
.done-toggle input:checked + .box { background: var(--done); border-color: var(--done); }
.done-toggle input:checked + .box::after {
  content: ""; display: block; width: 5px; height: 10px; margin: 2px auto 0;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
h3 .done-toggle input:checked + .box::after { width: 4px; height: 8px; margin-top: 1px; }
.done-toggle input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.step.is-done .h-text { color: var(--muted); }

/* ---------- Code blocks ---------- */
.code {
  margin: 14px 0 20px; border-radius: 8px; overflow: hidden;
  background: var(--code-bg); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.code-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 8px 5px 14px; background: var(--code-bar);
  font-size: 12px; color: #9aa1ab; letter-spacing: .03em; text-transform: uppercase;
}
.code-bar .copy {
  font: 12px system-ui, sans-serif; text-transform: none; letter-spacing: 0;
  color: #d6d9de; background: transparent; border: 1px solid #3a3f48; border-radius: 5px;
  padding: 3px 10px; cursor: pointer;
}
.code-bar .copy:hover { border-color: #6ea8ff; color: #fff; }
.code-bar .copy.ok { border-color: #4cc36b; color: #4cc36b; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code code { color: var(--code-text); font-size: 13.5px; line-height: 1.55; white-space: pre; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 14px 0 22px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
th { background: var(--surface-2); font-weight: 650; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* ---------- Callouts ---------- */
blockquote {
  margin: 16px 0; padding: 12px 16px; border-radius: 8px;
  background: var(--warn-bg); border-left: 4px solid var(--warn-border);
}
blockquote p:last-child { margin-bottom: 0; }

/* ---------- Mobile ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  nav.toc {
    position: fixed; top: 53px; left: 0; z-index: 15; width: min(320px, 85vw);
    background: var(--surface); box-shadow: 0 8px 30px rgba(0,0,0,.25);
    transform: translateX(-100%); transition: transform .2s ease;
  }
  body.toc-open nav.toc { transform: none; }
  main { padding: 20px 16px 100px; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .topbar h1 { display: none; }
  h2 { font-size: 22px; }
}
@media print {
  .topbar, nav.toc, .code-bar .copy, .done-toggle { display: none; }
  .layout { display: block; }
  .code { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="topbar">
  <button type="button" class="menu-btn" aria-label="Toggle contents">☰</button>
  <h1>{{TITLE}}</h1>
  <div class="progress" aria-live="polite">
    <div class="progress-track"><div class="progress-fill"></div></div>
    <span class="progress-label">0 / 0 done</span>
  </div>
  <button type="button" class="theme-btn" aria-label="Toggle theme">◐</button>
  <button type="button" class="reset-btn" title="Clear all checkmarks">Reset</button>
</header>
<div class="layout">
  <nav class="toc" aria-label="Contents">{{TOC}}</nav>
  <main><article class="content">{{BODY}}</article></main>
</div>
<script>
(function () {
  "use strict";
  var KEY = "arch-setup-progress-v1";
  var THEME_KEY = "arch-setup-theme";

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode: progress just isn't kept */ }
  }

  // ---- Theme ----
  var root = document.documentElement;
  var theme = load(THEME_KEY, null);
  if (theme) root.setAttribute("data-theme", theme);
  document.querySelector(".theme-btn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    save(THEME_KEY, next);
  });

  // ---- Progress checkboxes ----
  var state = load(KEY, {});
  var boxes = Array.prototype.slice.call(document.querySelectorAll("input[data-step]"));
  var fill = document.querySelector(".progress-fill");
  var label = document.querySelector(".progress-label");

  function render() {
    var done = 0;
    boxes.forEach(function (b) {
      var id = b.getAttribute("data-step");
      b.checked = !!state[id];
      if (b.checked) done++;
      b.closest(".step").classList.toggle("is-done", b.checked);
      var link = document.querySelector('nav.toc a[data-target="' + id + '"]');
      if (link) link.classList.toggle("is-done", b.checked);
    });
    fill.style.width = (boxes.length ? (done / boxes.length) * 100 : 0) + "%";
    label.textContent = done + " / " + boxes.length + " done";
  }
  boxes.forEach(function (b) {
    b.addEventListener("change", function () {
      var id = b.getAttribute("data-step");
      if (b.checked) state[id] = true; else delete state[id];
      save(KEY, state);
      render();
    });
  });
  document.querySelector(".reset-btn").addEventListener("click", function () {
    if (!confirm("Clear all checkmarks?")) return;
    state = {};
    save(KEY, state);
    render();
  });
  render();

  // ---- Copy buttons ----
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
  document.querySelectorAll(".code .copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var code = btn.closest(".code").querySelector("code").textContent.replace(/\n$/, "");
      copyText(code).then(function () {
        btn.textContent = "Copied"; btn.classList.add("ok");
      }, function () {
        btn.textContent = "Select & Ctrl+C";
      });
      setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600);
    });
  });

  // ---- Mobile TOC ----
  document.querySelector(".menu-btn").addEventListener("click", function () {
    document.body.classList.toggle("toc-open");
  });
  document.querySelectorAll("nav.toc a").forEach(function (a) {
    a.addEventListener("click", function () { document.body.classList.remove("toc-open"); });
  });

  // ---- Highlight current section in TOC ----
  var links = {};
  document.querySelectorAll("nav.toc a[data-target]").forEach(function (a) { links[a.getAttribute("data-target")] = a; });
  var headings = Array.prototype.slice.call(document.querySelectorAll("main h2[id], main h3[id]"));
  var current = null;
  function onScroll() {
    var y = 90, active = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top - y <= 0) active = headings[i].id; else break;
    }
    if (active !== current) {
      if (current && links[current]) links[current].classList.remove("active");
      if (active && links[active]) {
        links[active].classList.add("active");
        var nav = document.querySelector("nav.toc"), r = links[active].getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if (r.top < nr.top || r.bottom > nr.bottom) links[active].scrollIntoView({ block: "nearest" });
      }
      current = active;
    }
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
